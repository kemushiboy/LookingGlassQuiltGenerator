<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' qgmedia: blob: data:; media-src 'self' qgmedia: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Looking Glass Quilt Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Quilt Generator</div>
    <div class="group">
      <button id="btnNew" title="新規プロジェクト">新規</button>
      <button id="btnOpen" title="プロジェクトを開く (Ctrl+O)">開く</button>
      <button id="btnSave" title="プロジェクトを保存 (Ctrl+S)">保存</button>
      <span id="projectName" class="muted"></span>
    </div>
    <div class="group grow"></div>
    <div class="group">
      <label class="inline">出力先デバイス
        <select id="presetTop"></select>
      </label>
    </div>
    <div class="group bridge">
      <span id="bridgeDot" class="dot"></span>
      <span id="bridgeText" class="muted">Bridge 未接続</span>
      <button id="btnBridge">接続</button>
      <button id="btnMatchDevice" title="接続中の実機の quilt 設定に合わせる" disabled>実機に合わせる</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左: レイヤー -->
    <section class="panel left">
      <div class="panel-head">
        <h2>素材レイヤー</h2>
        <button id="btnAddMedia" class="primary">＋ 追加</button>
      </div>
      <p class="hint">動画・静止画をドロップして追加。Z が大きいほど奥に表示されます。</p>
      <ul id="layerList" class="layer-list"></ul>
      <div id="dropHint" class="drop-hint">ここにファイルをドロップ</div>
    </section>

    <!-- 中央: プレビュー -->
    <section class="center">
      <div class="preview-toolbar">
        <div class="seg" id="viewModes">
          <button data-mode="view" class="on">1ビュー</button>
          <button data-mode="wiggle">ウィグル</button>
          <button data-mode="sbs">左右端</button>
          <button data-mode="quilt">quilt</button>
        </div>
        <label class="inline view-slider">ビュー
          <input type="range" id="viewIndex" min="0" max="47" step="1" value="23">
          <span id="viewIndexLabel">23</span>
        </label>
        <div class="grow"></div>
        <button id="btnLkg" class="primary" title="実機ディスプレイに全画面ウィンドウを出してリアルタイムに表示（再生中も反映）" disabled>実機リアルタイム表示</button>
        <button id="btnCast" title="現在のフレームを quilt 画像にして実機に表示" disabled>このフレームを実機へ</button>
        <label class="inline"><input type="checkbox" id="liveCast" disabled> ライブ反映</label>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="preview"></canvas>
        <div id="emptyState" class="empty-state">
          <p>素材を追加してください</p>
          <p class="muted">前景・中景・背景など、任意の数の動画/静止画を重ねられます</p>
        </div>
      </div>
      <div class="transport">
        <button id="btnPlay" class="icon" title="再生 / 一時停止 (Space)">▶</button>
        <button id="btnStart" class="icon" title="先頭へ (Home)">⏮</button>
        <span id="timeLabel" class="time">0:00.00</span>
        <input type="range" id="timeSlider" min="0" max="1000" step="1" value="0" class="grow">
        <span id="durLabel" class="time muted">0:00.00</span>
      </div>
      <div class="timeline" id="timeline"></div>
    </section>

    <!-- 右: プロパティ -->
    <section class="panel right">
      <div class="tabs" id="tabs">
        <button data-tab="layer" class="on">素材</button>
        <button data-tab="project">全体</button>
        <button data-tab="audio">音声</button>
        <button data-tab="export">書き出し</button>
      </div>
      <div class="tab-body" id="tab-layer"></div>
      <div class="tab-body hidden" id="tab-project"></div>
      <div class="tab-body hidden" id="tab-audio"></div>
      <div class="tab-body hidden" id="tab-export">
        <div id="exportForm"></div>
        <div class="export-box">
          <div class="out-name" id="outName"></div>
          <div id="exportSummary" class="summary"></div>
          <div class="row">
            <button id="btnExport" class="primary big">収録（書き出し）</button>
            <button id="btnCancel" class="danger" disabled>中止</button>
          </div>
          <div class="progress"><div id="progressBar"></div></div>
          <div id="progressText" class="muted small"></div>
          <div class="row">
            <button id="btnCastOutput" disabled title="書き出した quilt 動画を実機で再生">実機で再生</button>
            <button id="btnShowOutput" disabled>フォルダを開く</button>
            <button id="btnCommand">ffmpeg コマンド</button>
          </div>
          <pre id="exportLog" class="log hidden"></pre>
        </div>
        <details class="settings">
          <summary>ffmpeg 設定</summary>
          <div id="ffmpegInfo" class="small muted"></div>
          <div class="row"><button id="btnPickFfmpeg">ffmpeg を指定…</button><button id="btnResetFfmpeg">自動検出に戻す</button></div>
        </details>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head"><h3 id="modalTitle"></h3><button id="modalClose" class="icon">✕</button></div>
      <div id="modalBody"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="../src/core.js"></script>
  <script src="preview.js"></script>
  <script src="sources.js"></script>
  <script src="app.js"></script>
</body>
</html>
